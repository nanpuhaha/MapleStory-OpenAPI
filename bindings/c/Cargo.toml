[package]
name = "maplestory-openapi-c"
version = "0.1.0"
edition = "2021"
description = "C-ABI FFI bindings for NEXON MapleStory OpenAPI, for C, C++, C#, Go, and Mobile"
license = "MIT"

[lib]
name = "maplestory_openapi_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
maplestory-openapi = { path = "../../maplestory-openapi", features = ["animation", "cache"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1.0"
libc = "0.2"
