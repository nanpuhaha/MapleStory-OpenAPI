[package]
name = "maplestory-openapi"
version = "0.1.0"
edition = "2021"
description = "Rust client library for NEXON MapleStory OpenAPI"
readme = "README.md"
license = "MIT"
repository = "https://github.com/yourusername/maplestory-openapi-rust"
documentation = "https://docs.rs/maplestory-openapi"
keywords = ["maplestory", "nexon", "openapi", "game", "api"]
categories = ["api-bindings", "web-programming", "async"]

[dependencies]
# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# URL building
url = "2.5"

# Logging
tracing = "0.1"

# Caching (optional feature)
moka = { version = "0.12", features = ["future"], optional = true }

[features]
default = []
cache = ["moka"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-test = "0.4"
pretty_assertions = "1.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "maplestory_openapi"
path = "src/lib.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "quick_lookup"
path = "examples/quick_lookup.rs"

[[example]]
name = "character_full_info"
path = "examples/character_full_info.rs"