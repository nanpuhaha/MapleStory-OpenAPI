[package]
name = "maplestory-openapi"
version = "0.1.0"
edition = "2021"
description = "Production-quality, ergonomic Rust client library for NEXON MapleStory OpenAPI"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/maplestory-openapi-rust"
documentation = "https://docs.rs/maplestory-openapi"
keywords = ["maplestory", "nexon", "openapi", "game", "api"]
categories = ["api-bindings", "web-programming", "async"]
include = [
    "src/**/*",
    "tests/**/*",
    "examples/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
]

[dependencies]
# HTTP client (TLS backends configured via features)
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"

# URL building
url = "2.5"

# Lightweight async utilities (no heavyweight runtime dependency)
futures-util = { version = "0.3", default-features = false, features = ["alloc", "async-await", "async-await-macro"] }

# Logging
tracing = "0.1"

# In-memory OCID caching (optional feature)
moka = { version = "0.12", features = ["future"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "gif"], optional = true }

[features]
default = ["default-tls"]
default-tls = ["reqwest/default-tls"]
rustls-tls = ["reqwest/rustls-tls"]
cache = ["dep:moka"]
animation = ["dep:image"]

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4"
pretty_assertions = "1.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[lib]
name = "maplestory_openapi"
path = "src/lib.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "quick_lookup"
path = "examples/quick_lookup.rs"

[[example]]
name = "character_full_info"
path = "examples/character_full_info.rs"

[[example]]
name = "inspect_coordination"
path = "examples/inspect_coordination.rs"

[[example]]
name = "coordination_lookup"
path = "examples/coordination_lookup.rs"

[[example]]
name = "investigate_details"
path = "examples/investigate_details.rs"

[[example]]
name = "character_dashboard"
path = "examples/character_dashboard.rs"

[[example]]
name = "avatar_animation_gif"
path = "examples/avatar_animation_gif.rs"
required-features = ["animation"]
