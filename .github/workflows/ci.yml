name: CI (Manual Trigger)

# 수동 실행 전용 (Manual trigger only via workflow_dispatch)
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (all targets & all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite & Doc Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace Tests (all features)
        run: cargo test --all --all-features
      - name: Documentation Tests
        run: cargo test --doc --all-features
      - name: Check Examples
        run: cargo check --examples --all-features

  matrix-cross-platform:
    name: Cross-Platform Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Core Crate & C-ABI
        run: cargo check --all-targets -p maplestory-openapi -p maplestory-openapi-c
