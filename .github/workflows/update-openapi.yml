name: Update MapleStory OpenAPI Specs

on:
  workflow_dispatch: # 수동 실행
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 00:00 UTC (KST 09:00)

permissions:
  contents: write

jobs:
  update-specs:
    name: Check & Update Specs
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and update OpenAPI specifications
        run: |
          python scripts/update_openapi_specs.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openapi/
          if git diff --staged --quiet; then
            echo "No changes detected in OpenAPI specs. Skipping commit."
          else
            echo "Changes detected! Committing and pushing..."
            git commit -m "chore(openapi): update MapleStory OpenAPI specifications"
            git push
          fi
