[package]
name = "maple-cli"
version = "0.1.0"
edition = "2021"
description = "Lightweight terminal CLI utility for MapleStory OpenAPI"
license = "MIT OR Apache-2.0"
authors = ["MapleStory OpenAPI Contributors"]

[[bin]]
name = "maple"
path = "src/main.rs"

[dependencies]
maplestory-openapi = { path = "../maplestory-openapi", features = ["animation", "cache", "default-tls"] }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
